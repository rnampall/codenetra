[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codenetra"
version = "0.1.0"
description = "Codenetra — the eye on every repo. GitLab hygiene & compliance reports in seconds."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ramesh Nampelly" }]
keywords = [
    "gitlab", "compliance", "scanner", "code-quality", "audit",
    "hygiene", "devops", "governance", "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/rnampall/codenetra"
Repository = "https://github.com/rnampall/codenetra"
Issues = "https://github.com/rnampall/codenetra/issues"
Changelog = "https://github.com/rnampall/codenetra/blob/main/CHANGELOG.md"
dependencies = [
    "python-gitlab>=4.4.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
codenetra = "codenetra.cli:main"

[tool.setuptools.packages.find]
include = ["codenetra*"]

[tool.setuptools.package-data]
codenetra = [
    "templates/*.j2",
    "templates/web/*.html",
    "rules_data/*.yaml",
]
